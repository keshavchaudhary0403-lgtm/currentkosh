<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CurrentKosh</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(circle at 1px 1px, rgb(16 17 14 / .07) 1px, transparent 0) 0 0 / 22px 22px, #f3f2ec; color: #10110e; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
      .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid rgb(16 17 14 / .08); border-radius: 28px; padding: 36px 28px; box-shadow: 0 24px 60px -24px rgb(16 17 14 / .35); }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { font-family: ui-serif, Georgia, serif; font-weight: 400; font-style: italic; font-size: 40px; letter-spacing: -0.02em; margin: 18px 0 8px; }
      p { color: #4b4c46; line-height: 1.55; margin: 0 0 24px; }
      button { background: #c8f135; color: #10110e; border: 0; border-radius: 999px; min-height: 48px; padding: 0 26px; font-weight: 600; font-size: 15px; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: radial-gradient(circle at 1px 1px, rgb(255 255 245 / .06) 1px, transparent 0) 0 0 / 22px 22px, #0b0c0a; color: #f1f1ea; } .card { background: #151613; border-color: rgb(255 255 245 / .1); } p { color: #b0b1a7; } button { background: #d4f84c; } }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page hasn't been saved on your phone yet. Stories you've already opened still work. Reconnect to get today's news.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
